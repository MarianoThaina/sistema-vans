<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dados do cliente</title><link rel="stylesheet" href="css/style.css"></head>
<body><main><h1>DADOS DO CLIENTE</h1>
<form id="f"><div class="row" style="justify-content:space-between"><div><label for="registro">Número do registro :</label><input id="registro" name="registro" readonly></div>
<div><label for="nascimento">Data de Nascimento :</label><input id="nascimento" type="date" name="nascimento"></div></div>
<h2>Dados Pessoais</h2><div class="grid2">
<div><label for="nome">Nome</label><input id="nome" name="nome" required></div><div><label for="cpf">CPF</label><input id="cpf" name="cpf" inputmode="numeric"></div>
<div><label for="telefone">Telefone / Celular</label><input id="telefone" name="telefone" type="tel"></div><div><label for="email">E-mail</label><input id="email" name="email" type="email"></div></div>
<h2>Endereço</h2><div class="grid2"><div><label for="rua">Rua</label><input id="rua" name="rua"></div><div><label for="numero">Número</label><input id="numero" name="numero"></div>
<div><label for="bairro">Bairro</label><input id="bairro" name="bairro"></div><div><label for="cidade">Cidade</label><input id="cidade" name="cidade"></div><div><label for="cep">CEP</label><input id="cep" name="cep"></div></div>
<p class="err" id="err" role="alert"></p>
<div class="actions"><a class="btn" href="clientes.html">Cancelar</a><button class="btn ok">Salvar</button></div></form></main>
<script src="js/api.js"></script><script src="js/layout.js"></script><script>
Layout.mount('clientes');const id=qs('id')||1,f=$('#f');
Api.obterCliente(id).then(c=>fillForm(f,c)).catch(e=>$('#err').textContent=e.message);
f.onsubmit=async e=>{e.preventDefault();try{await Api.atualizarCliente(id,formData(f));location.href='clientes.html'}catch(x){$('#err').textContent=x.message}};
</script></body></html>
