<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Configurações</title><link rel="stylesheet" href="css/style.css"></head>
<body><main><h1>Configurações</h1>
<form id="f" style="max-width:520px"><h2>Dados da empresa</h2><div class="grid2">
<div style="grid-column:1/3"><label for="empresa">Nome da empresa</label><input id="empresa" name="empresa" required></div>
<div><label for="cnpj">CNPJ</label><input id="cnpj" name="cnpj" placeholder="00.000.000/0000-00"></div><div><label for="telefone">Telefone</label><input id="telefone" name="telefone" type="tel"></div>
<div style="grid-column:1/3"><label for="email">E-mail de contato</label><input id="email" name="email" type="email"></div></div>
<p class="err" id="err" role="alert"></p><p class="ok-msg" id="ok" role="status"></p>
<div class="actions"><button class="btn ok">Salvar</button></div></form></main>
<script src="js/api.js"></script><script src="js/layout.js"></script><script>
Layout.mount('config');const f=$('#f');
Api.obterConfig().then(c=>fillForm(f,c)).catch(e=>$('#err').textContent=e.message);
f.onsubmit=async e=>{e.preventDefault();$('#ok').textContent='';try{await Api.salvarConfig(formData(f));$('#err').textContent='';$('#ok').textContent='Configurações salvas.'}catch(x){$('#err').textContent=x.message}};
</script></body></html>
